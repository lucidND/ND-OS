<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070d1d">
<title>ND OS — Home</title>
<style>
:root{color-scheme:dark;--bg:#070d1d;--panel:#101b34;--line:#20345b;--blue:#38a5ff;--muted:#9db0d0;--white:#eef6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#102d58 0%,var(--bg) 52%);color:var(--white);font-family:Inter,system-ui,Arial,sans-serif}
.phone{width:min(100%,440px);min-height:100vh;margin:auto;padding:22px 20px 104px;position:relative}
.status{display:flex;justify-content:space-between;font-size:12px;color:#c3d4ef;margin-bottom:32px}
.brand{display:flex;align-items:center;gap:13px}.mark{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:22px;font-weight:900;letter-spacing:-2px;color:white;background:linear-gradient(145deg,#174b89,#07152e);border:1px solid #3b9fff;box-shadow:0 0 24px #168dff55;text-shadow:0 0 14px #64c4ff}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:2px}.brand strong{font-size:20px;letter-spacing:1px}
.greeting{margin:35px 0 18px}.greeting p{color:var(--muted);margin:0 0 7px}.greeting h1{font-size:29px;margin:0;letter-spacing:-1px}
.clock{font-size:14px;color:#8dcaff;margin-top:10px}
.assistant{margin-top:24px;padding:18px;border:1px solid #2862a1;border-radius:22px;background:linear-gradient(135deg,#112b50,#101a31 72%);box-shadow:0 12px 40px #0005}
.assistant-head{display:flex;align-items:center;gap:10px}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c5f0ff,#269cff 40%,#113d8d 75%);box-shadow:0 0 22px #259cff88}.assistant-head strong{font-size:15px}.online{margin-left:auto;font-size:10px;color:#82e5c2}
.assistant p{font-size:13px;line-height:1.5;color:#c5d5ed;margin:14px 0}
.ask{display:flex;gap:8px}.ask input{min-width:0;flex:1;border:1px solid #34527b;border-radius:13px;background:#08142a;color:white;padding:12px;font-size:13px;outline:none}.ask button{border:0;border-radius:12px;padding:0 15px;color:#061426;background:linear-gradient(135deg,#8cdbff,#319dff);font-weight:800}
.section{display:flex;justify-content:space-between;align-items:center;margin:27px 2px 13px}.section strong{font-size:14px}.section span{font-size:11px;color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.app{border:1px solid #1b3154;background:#0d1930;border-radius:17px;padding:13px 5px;text-align:center;color:white;font:inherit;cursor:pointer}.app:active,.nav button:active{transform:scale(.96)}.app .emoji{display:block;font-size:23px;margin-bottom:8px}.app small{font-size:10px;color:#c2d2e9}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:1px solid #1c3152;border-radius:15px;background:#0d1930;color:white;padding:13px;text-align:left}.tile b{display:block;font-size:12px;margin-bottom:4px}.tile span{font-size:10px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);display:flex;justify-content:space-around;padding:13px 16px calc(13px + env(safe-area-inset-bottom));background:#081226ee;border-top:1px solid #1b3152;backdrop-filter:blur(16px)}
.nav button{border:0;background:transparent;color:#a9bddb;font:inherit;font-size:11px;cursor:pointer}.nav button.active{color:#66c3ff}.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:4px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#17365c;border:1px solid #398bd0;border-radius:14px;padding:11px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}
@media(min-width:600px){body{padding:20px 0}.phone{min-height:850px;border:1px solid #1a3156;border-radius:34px;overflow:hidden}.nav{bottom:20px;border-radius:0 0 34px 34px}}
</style>
</head>
<body>
<main class="phone">
  <div class="status"><span id="status-time">9:41</span><span>● ● ●　▰</span></div>
  <header class="brand"><div class="mark">ND</div><div><strong>ND OS</strong><small>SMARTER • STRONGER • YOURS</small></div></header>
  <section class="greeting"><p id="date-line">YOUR PERSONAL SPACE</p><h1>Good evening.</h1><div class="clock" id="clock">Loading time…</div></section>
  <section class="assistant">
    <div class="assistant-head"><div class="orb"></div><strong>ND Assistant</strong><span class="online">● READY</span></div>
    <p>Hello. I’m ND. What would you like to do today?</p>
    <form class="ask" id="ask-form"><input id="ask-input" placeholder="Ask ND anything…" autocomplete="off"><button type="submit">Send</button></form>
  </section>
  <div class="section"><strong>Your apps</strong><span>PERSONAL SPACE</span></div>
  <section class="apps">
    <button class="app" data-app="Phone"><span class="emoji">☎️</span><small>Phone</small></button>
    <button class="app" data-app="Messages"><span class="emoji">✉️</span><small>Messages</small></button>
    <button class="app" data-app="Music"><span class="emoji">♫</span><small>Music</small></button>
    <button class="app" data-app="Camera"><span class="emoji">◎</span><small>Camera</small></button>
    <button class="app" data-app="Files"><span class="emoji">▣</span><small>Files</small></button>
    <button class="app" data-app="Settings"><span class="emoji">⚙</span><small>Settings</small></button>
    <button class="app" data-app="Browser"><span class="emoji">◉</span><small>Browser</small></button>
    <button class="app" data-app="More apps"><span class="emoji">＋</span><small>More</small></button>
  </section>
  <div class="section"><strong>Quick panel</strong><span>DEMO CONTROLS</span></div>
  <section class="quick">
    <button class="tile" data-app="Connectivity"><b>⌁　Connectivity</b><span>Network controls preview</span></button>
    <button class="tile" data-app="Sound"><b>♫　Sound</b><span>Audio settings preview</span></button>
  </section>
</main>
<nav class="nav"><button class="active" data-tab="Home"><i>⌂</i>Home</button><button data-tab="Assistant"><i>✧</i>ND</button><button data-tab="Apps"><i>▦</i>Apps</button><button data-tab="Settings"><i>⚙</i>Settings</button></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const clock=document.getElementById('clock');
const statusTime=document.getElementById('status-time');
const dateLine=document.getElementById('date-line');
function updateClock(){const now=new Date();clock.textContent=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'  •  '+now.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});statusTime.textContent=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});dateLine.textContent=now.toLocaleDateString([], {weekday:'long'}).toUpperCase();}
updateClock();setInterval(updateClock,30000);
const toast=document.getElementById('toast');
function notify(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200);}
document.querySelectorAll('[data-app]').forEach(button=>button.addEventListener('click',()=>notify(button.dataset.app+' is a preview tile. Phone controls are not connected yet.')));
document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(item=>item.classList.remove('active'));button.classList.add('active');notify(button.dataset.tab+' section preview');}));
document.getElementById('ask-form').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('ask-input');if(!input.value.trim())return;notify('This prototype is not connected to the ND AI engine yet.');input.value='';});
</script>
</body>
</html>
